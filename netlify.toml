[build]
  command = "npm run build"
  publish = "dist"
  edge_functions = "netlify/edge-functions"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[edge_functions]]
  path = "/api/stream-proxy"
  function = "streamProxy"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
